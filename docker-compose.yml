services:
  postgres:
    image: postgres:16-alpine
    container_name: planner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1405}
      POSTGRES_DB: planner_logistica
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planner_logistica"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: plannerlogistica-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planner_backend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-1405}@postgres:5432/planner_logistica
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-10f9919deb23ef2dabd560f2f107440b58392d0ec80cb701ca64f75d5dde79b3}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: plannerlogistica-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planner_frontend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "8080:80"
      - "5173:80"
    depends_on:
      - backend


volumes:
  postgres_data:
